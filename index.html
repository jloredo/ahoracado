<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ahorcado del Elenco Color</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Libre+Franklin:wght@400;600;700&display=swap">
<style>
/* Layout: formato celular, una columna — palabra secreta arriba, horca + contador, guiones, teclado, arriesgar abajo.
   Diseño de un solo tema: sala violeta con luces de escenario de colores. */
:root{
  --bg:#1e0b3a; --panel:#2c1352; --fg:#fff6e6; --muted:#c9b6ef; --line:#4a2a7a;
  --gold:#ffc83d; --gold-ink:#2a1200; --ok:#2ee6c5; --bad:#ff6b4a;
  --pink:#ff3d7f; --cyan:#2ec8ff; --lime:#b6f24a; --orange:#ff8a1f;
  --display:"Rozha One",Georgia,serif; --body:"Libre Franklin",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;padding:0 16px;
  background-image:
    radial-gradient(ellipse 45% 40% at 10% 0%,rgba(255,61,127,.38),transparent 70%),
    radial-gradient(ellipse 45% 40% at 50% 0%,rgba(255,200,61,.28),transparent 70%),
    radial-gradient(ellipse 45% 40% at 90% 0%,rgba(46,200,255,.35),transparent 70%),
    radial-gradient(ellipse 60% 35% at 50% 100%,rgba(182,242,74,.14),transparent 70%);}
.wrap{max-width:460px;margin:0 auto;padding-block:16px 32px;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,12vw,56px);letter-spacing:.04em;margin:0;line-height:1;text-align:center;
  background:linear-gradient(90deg,var(--pink),var(--gold) 50%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 12px 40px rgba(255,61,127,.16)}
.label{display:block;font:700 11px var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:0 0 8px}
.row{display:flex;flex-wrap:wrap;gap:8px}
input[type=text],input[type=password]{flex:1 1 180px;min-width:0;font:400 16px var(--body);padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);min-height:48px}
input:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.btn{font:600 15px var(--body);padding:12px 18px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;min-height:48px}
.btn.primary{background:linear-gradient(90deg,var(--pink),var(--orange));border-color:transparent;color:#fff}
.btn.small{min-height:40px;padding:8px 14px;font-size:13px}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.note{margin:8px 0 0;font-size:13px;color:var(--muted);min-height:1.2em;overflow-wrap:anywhere}
.note.ok{color:var(--ok)} .note.bad{color:var(--bad)}
.shareBox{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.shareBox input{font-size:13px;min-height:40px}
.stage{display:flex;align-items:center;gap:14px;padding:10px 14px}
.stage svg{width:42%;max-width:150px;height:auto;flex:none;display:block}
.lives{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.lives b{color:var(--fg);font:400 30px var(--display);letter-spacing:0;font-variant-numeric:tabular-nums}
.result{font:400 22px var(--display);min-height:1.2em}
.result.win{color:var(--ok)} .result.lose{color:var(--bad)}
.word{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 18px}
.wgrp{display:flex;gap:4px}
.slot{width:clamp(24px,8vw,34px);height:44px;border-bottom:4px solid var(--gold);display:grid;place-items:center;font:400 clamp(22px,6.5vw,30px) var(--display);color:var(--fg)}
.wgrp .slot:nth-child(4n+1){border-color:var(--pink)} .wgrp .slot:nth-child(4n+2){border-color:var(--gold)}
.wgrp .slot:nth-child(4n+3){border-color:var(--cyan)} .wgrp .slot:nth-child(4n){border-color:var(--lime)}
.slot.miss{color:var(--bad)}
.slot.pop{animation:pop .3s ease-out}
@keyframes pop{from{transform:translateY(-8px);opacity:.1}}
.empty{color:var(--muted);text-align:center;font-size:14px;padding:8px 0}
.kb{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.kb button{font:700 18px var(--body);min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;transition:transform .08s}
.kb button:active:not(:disabled){transform:scale(.94)}
.kb button.no{background:transparent;color:var(--muted);opacity:.4;text-decoration:line-through}
.kb button:nth-child(4n+1).hit{background:var(--pink);border-color:var(--pink);color:#fff}
.kb button:nth-child(4n+2).hit{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.kb button:nth-child(4n+3).hit{background:var(--cyan);border-color:var(--cyan);color:#06243a}
.kb button:nth-child(4n).hit{background:var(--lime);border-color:var(--lime);color:#1c2a05}
.kb button:disabled{cursor:default}
.marquee{position:relative;overflow:hidden;border-color:var(--pink);text-align:center}
.marquee h2{margin:0 0 4px;font:400 26px var(--display)}
.marquee .tries{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin:0 0 12px}
.curtain{position:absolute;top:0;bottom:0;width:51%;z-index:2;transition:transform .9s cubic-bezier(.6,.05,.3,1);
  background:repeating-linear-gradient(90deg,#5a0f19 0 14px,#7e1726 14px 26px,#5a0f19 26px 34px)}
.curtain.l{left:0;transform:translateX(-101%)} .curtain.r{right:0;transform:translateX(101%)}
.marquee.closed .curtain{transform:translateX(0)}
.curtainMsg{position:absolute;inset:0;z-index:3;display:grid;place-items:center;font:400 28px var(--display);color:var(--fg);opacity:0;transition:opacity .4s .8s;pointer-events:none}
.marquee.closed .curtainMsg{opacity:1}
.marquee.won{box-shadow:0 0 0 2px var(--ok),0 12px 40px rgba(46,230,197,.3)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body style="margin:0">

<div class="wrap">
  <h1>AHORCADO</h1>

  <section class="card" aria-labelledby="setLbl">
    <label class="label" id="setLbl" for="secret">Palabra secreta</label>
    <form class="row" id="setForm">
      <input id="secret" type="password" autocomplete="off" placeholder="Escribí la palabra o nombre">
      <button class="btn primary" type="submit">Armar</button>
    </form>
    <div class="row" style="margin-top:8px">
      <button class="btn small" type="button" id="btnPeek">Mostrar</button>
      <button class="btn small" type="button" id="btnShare">Copiar link para jugar online</button>
    </div>
    <div class="shareBox" id="shareBox" hidden>
      <label class="sr" for="shareUrl">Link para compartir</label>
      <input id="shareUrl" type="text" readonly>
    </div>
    <p class="note" id="setMsg" aria-live="polite"></p>
  </section>

  <section class="card stage">
    <svg viewBox="0 0 240 260" role="img" aria-label="Horca">
      <g stroke="var(--muted)" stroke-width="6" stroke-linecap="round" fill="none">
        <line x1="20" y1="248" x2="130" y2="248"/>
        <line x1="50" y1="248" x2="50" y2="20"/>
        <line x1="50" y1="20" x2="160" y2="20"/>
        <line x1="50" y1="56" x2="86" y2="20"/>
      </g>
      <line x1="160" y1="20" x2="160" y2="52" stroke="var(--gold)" stroke-width="3"/>
      <g id="fig" stroke="var(--fg)" stroke-width="5" stroke-linecap="round" fill="none">
        <circle data-p="0" cx="160" cy="70" r="18"/>
        <line data-p="1" x1="160" y1="88" x2="160" y2="150"/>
        <line data-p="2" x1="160" y1="104" x2="132" y2="132"/>
        <line data-p="3" x1="160" y1="104" x2="188" y2="132"/>
        <line data-p="4" x1="160" y1="150" x2="138" y2="196"/>
        <line data-p="5" x1="160" y1="150" x2="182" y2="196"/>
      </g>
    </svg>
    <div class="lives"><span>Errores</span><b id="errTxt">0 / 5</b><span class="result" id="result" aria-live="polite"></span></div>
  </section>

  <div class="word" id="word" aria-label="Palabra a adivinar"></div>
  <div class="kb" id="kb"></div>
  <div class="row"><button class="btn" id="btnRetry" style="flex:1">Volver a jugar</button></div>

  <section class="card marquee" id="marquee">
    <div class="curtain l" aria-hidden="true"></div><div class="curtain r" aria-hidden="true"></div>
    <div class="curtainMsg" aria-hidden="true">Telón. Sin intentos.</div>
    <h2>Arriesgar la palabra</h2>
    <p class="tries"><span id="triesLeft">3</span> intentos de 3</p>
    <form class="row" id="guessForm">
      <label for="wordGuess" class="sr">Arriesgar la palabra completa</label>
      <input id="wordGuess" type="text" autocomplete="off" placeholder="Escribí la palabra completa">
      <button class="btn primary" type="submit" style="flex:1 1 100%">Arriesgar</button>
    </form>
    <p class="note" id="guessMsg" aria-live="polite"></p>
  </section>
</div>

<script>
const DEFAULT_WORD="MIGUEL ÁNGEL CHERUTTI";
const LETTERS="ABCDEFGHIJKLMNÑOPQRSTUVWXYZ".split("");
const MAX=5, MAX_TRIES=3;
const norm=c=>c==="Ñ"?"Ñ":c.normalize("NFD").replace(/[̀-ͯ]/g,"");
const clean=s=>s.toUpperCase().replace(/Ñ/g,"\u0001").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\u0001/g,"Ñ").replace(/[^A-ZÑ ]/g,"").replace(/\s+/g," ").trim();
const tidy=s=>s.toUpperCase().replace(/[^A-ZÁÉÍÓÚÜÑ ]/g,"").replace(/\s+/g," ").trim();
const $=id=>document.getElementById(id);
const parts=[...document.querySelectorAll("#fig [data-p]")];
let WORD="",guessed=new Set(),errors=0,over=false,tries=0;

/* link compartible: la palabra va codificada en el #, no a simple vista */
const enc=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const dec=s=>{try{s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return decodeURIComponent(escape(atob(s)))}catch(e){return ""}};

LETTERS.forEach(L=>{const b=document.createElement("button");b.textContent=L;b.id="k"+L;b.setAttribute("aria-label","Letra "+L);b.onclick=()=>guess(L);$("kb").appendChild(b)});

function setWord(w,fromLink){
  WORD=tidy(w);
  if(!WORD){$("setMsg").textContent="Escribí al menos una letra.";$("setMsg").className="note bad";return}
  $("secret").value="";$("shareBox").hidden=true;
  $("setMsg").textContent=fromLink?"Palabra cargada desde el link. ¡A jugar!":"Listo: "+WORD.replace(/ /g,"").length+" letras. ¡A jugar!";
  $("setMsg").className="note ok";
  start();
}
function start(){
  guessed=new Set();errors=0;over=false;tries=0;
  $("result").textContent="";$("result").className="result";
  $("triesLeft").textContent=MAX_TRIES;$("guessMsg").textContent="";$("guessMsg").className="note";
  $("guessForm").hidden=false;$("wordGuess").value="";
  $("marquee").classList.remove("closed","won");
  LETTERS.forEach(L=>{const b=$("k"+L);b.className="";b.disabled=false});
  render();
}
function render(reveal){
  const w=$("word");w.innerHTML="";
  WORD.split(" ").forEach(part=>{
    const g=document.createElement("div");g.className="wgrp";
    [...part].forEach(ch=>{
      const s=document.createElement("div");s.className="slot";
      if(guessed.has(norm(ch)))s.textContent=ch;
      else if(reveal){s.textContent=ch;if(reveal==="lose")s.classList.add("miss")}
      g.appendChild(s);
    });
    w.appendChild(g);
  });
  const shown=errors>=MAX?parts.length:errors;
  parts.forEach((p,i)=>p.style.display=i<shown?"":"none");
  $("fig").setAttribute("stroke",over&&errors>=MAX?"var(--bad)":"var(--fg)");
  $("errTxt").textContent=errors+" / "+MAX;
}
function end(won){
  over=true;
  LETTERS.forEach(x=>$("k"+x).disabled=true);
  $("guessForm").hidden=true;
  if(won){$("result").textContent="¡Bravo!";$("result").className="result win";$("marquee").classList.add("won");confetti();render("win")}
  else{$("result").textContent="Perdiste";$("result").className="result lose";render("lose")}
}
function guess(L){
  if(over||guessed.has(L))return;
  guessed.add(L);
  const letters=[...WORD.replace(/ /g,"")].map(norm);
  const hit=letters.includes(L);
  const b=$("k"+L);b.disabled=true;b.classList.add(hit?"hit":"no");
  if(!hit)errors++;
  if(letters.every(c=>guessed.has(c)))return end(true);
  if(errors>=MAX)return end(false);
  render();
  if(hit)document.querySelectorAll(".slot").forEach(s=>{if(norm(s.textContent)===L)s.classList.add("pop")});
}
$("guessForm").addEventListener("submit",e=>{
  e.preventDefault();
  if(over)return;
  const v=$("wordGuess").value,m=$("guessMsg");
  if(!v.trim()){m.textContent="Escribí la palabra completa para arriesgar.";m.className="note";return}
  tries++;$("triesLeft").textContent=MAX_TRIES-tries;
  if(clean(v)===clean(WORD)){m.textContent="";return end(true)}
  const f=$("guessForm");f.classList.remove("shake");void f.offsetWidth;f.classList.add("shake");
  $("wordGuess").value="";
  if(tries>=MAX_TRIES){m.textContent="";$("marquee").classList.add("closed");return end(false)}
  const left=MAX_TRIES-tries;
  m.textContent="No es esa. Te queda"+(left>1?"n "+left+" intentos.":" 1 intento.");m.className="note bad";
});
$("setForm").addEventListener("submit",e=>{e.preventDefault();setWord($("secret").value)});
$("btnPeek").onclick=()=>{const i=$("secret"),show=i.type==="password";i.type=show?"text":"password";$("btnPeek").textContent=show?"Ocultar":"Mostrar"};
$("btnShare").onclick=()=>{
  const typed=tidy($("secret").value), w=typed||WORD;
  if(!w)return;
  if(typed)setWord(typed);
  const url=location.href.split("#")[0]+"#"+enc(w);
  $("shareUrl").value=url;$("shareBox").hidden=false;
  const ok=()=>{$("setMsg").textContent="Link copiado. Mandáselo a quien tenga que adivinar.";$("setMsg").className="note ok"};
  const fail=()=>{$("shareUrl").select();$("setMsg").textContent="Copiá el link de arriba y mandáselo a quien tenga que adivinar.";$("setMsg").className="note"};
  try{navigator.clipboard.writeText(url).then(ok,fail)}catch(e){fail()}
};
$("btnRetry").onclick=start;
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=document.createElement("canvas");c.id="fx";document.body.appendChild(c);
  const x=c.getContext("2d"),W=c.width=innerWidth,H=c.height=innerHeight;
  const cols=["#ff3d7f","#ffc83d","#2ec8ff","#b6f24a","#fff6e6"];
  const p=Array.from({length:150},()=>({x:Math.random()*W,y:-Math.random()*H*.6,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:Math.random()*6.3,s:4+Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  (function f(t){
    x.clearRect(0,0,W,H);
    p.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.r+=.1;x.save();x.translate(q.x,q.y);x.rotate(q.r);x.fillStyle=q.c;x.fillRect(-q.s/2,-q.s/4,q.s,q.s/2);x.restore()});
    if(t-t0<4000)requestAnimationFrame(f);else c.remove();
  })(t0);
}
document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.target.closest&&e.target.closest("input"))return;
  const k=norm(e.key.toUpperCase());
  if(LETTERS.includes(k)){e.preventDefault();guess(k)}
});
const fromHash=location.hash.length>1?tidy(dec(location.hash.slice(1))):"";
if(fromHash)setWord(fromHash,true);else{WORD=DEFAULT_WORD;start()}
</script>
</body>
</html>
